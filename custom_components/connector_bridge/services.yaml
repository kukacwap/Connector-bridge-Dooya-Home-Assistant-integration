move_for_duration:
  target:
    entity:
      domain: cover
      integration: connector_bridge
  fields:
    direction:
      required: true
      example: open
      default: open
      selector:
        select:
          options:
            - label: Open
              value: open
            - label: Close
              value: close
    duration:
      required: true
      example: 2
      default: 2
      selector:
        number:
          min: 0.1
          max: 300
          step: 0.1
          unit_of_measurement: seconds
          mode: box
