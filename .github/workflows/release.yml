name: Release

# Pushing a V* tag publishes the matching GitHub release, which is what HACS
# offers to users as an update. The tag must match manifest.json, and the
# notes come from the CHANGELOG section for that version.
on:
  push:
    tags:
      - "V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the release notes from CHANGELOG.md
        id: notes
        run: |
          python3 - <<'EOF'
          import json
          import os
          import pathlib
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("Vv")

          manifest = json.loads(
              pathlib.Path("custom_components/connector_bridge/manifest.json").read_text()
          )
          if manifest["version"] != version:
              sys.exit(
                  f"::error::Tag {tag} does not match manifest version "
                  f"{manifest['version']}"
              )

          lines = pathlib.Path("CHANGELOG.md").read_text().splitlines()
          try:
              start = lines.index(f"## {version}") + 1
          except ValueError:
              sys.exit(f"::error::CHANGELOG.md has no '## {version}' section")
          end = next(
              (i for i, line in enumerate(lines[start:], start) if line.startswith("## ")),
              len(lines),
          )

          body = "\n".join(lines[start:end]).strip()
          headline = next(
              (line for line in body.splitlines() if line.strip()), ""
          ).rstrip(".")

          pathlib.Path("release-notes.md").write_text(body + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"title={tag} — {headline}\n")
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.notes.outputs.title }}" \
            --notes-file release-notes.md \
            --verify-tag
